name: Deploy Supabase Edge Function

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-generate-feedback
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NPM_CONFIG_YES: "true"
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          if [[ -z "${SUPABASE_PROJECT_REF//[[:space:]]/}" ]]; then
            echo "::error::Missing SUPABASE_PROJECT_REF. Set it in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [[ -z "${SUPABASE_ACCESS_TOKEN//[[:space:]]/}" ]]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN. Set it in Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy generate-feedback
        run: npx supabase functions deploy generate-feedback --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
